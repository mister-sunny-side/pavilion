# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Ruff for Python formatting, linting, and import sorting
  - repo: local
    hooks:
      # Run ruff linter
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true
        always_run: false
      # Run ruff formatter
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true
        always_run: false

  # Rustfmt for Rust code formatting (matches CI: cargo fmt --all -- --check).
  # pass_filenames: false so rustfmt.toml reorder_modules/etc. apply workspace-wide,
  # not only to staged files — otherwise CI can fail on untouched modules.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        files: \.rs$
        pass_filenames: false

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
